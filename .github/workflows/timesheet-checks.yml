name: Timesheet checks
on:
  push:
    branches: [feature/monthly-timesheet]
  pull_request:
    paths:
      - 'timesheet.js'
      - 'tests/**'
      - 'index.html'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check timesheet.js
      - run: node --test tests/timesheet.test.cjs
